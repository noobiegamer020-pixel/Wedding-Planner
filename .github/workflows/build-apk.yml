name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Web files
        run: mkdir -p www && cp index.html www/
      - name: Android project and icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Same signing key every build
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Wedding-Planner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
