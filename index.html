<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Planner</title>
<meta name="theme-color" content="#b4456b">
<style>
:root{--bg:#fbf6f4;--card:#fff;--ink:#2a1f24;--mute:#8a7a82;--line:#f1e5e8;--rose:#b4456b;--rose2:#e08aa6;--gold:#d4a23a;--plum:#6e3478;--green:#1f9d6b;--amber:#d98a1b;--red:#d6455d;--mz:#3f6fd1;--ch:#d6457a;--sh:0 1px 2px rgba(90,30,55,.06),0 10px 28px rgba(90,30,55,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#161018;--card:#221a26;--ink:#f6ecef;--mute:#a999a3;--line:#352839;--rose:#e0709a;--rose2:#b4456b;--green:#3fd29a;--red:#ff7488;--mz:#7ea2f0;--ch:#f27aa8;--sh:0 1px 2px #0006,0 10px 28px #0005}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:linear-gradient(135deg,#b4456b 0%,#8e3a74 55%,#6e3478 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 58px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;border:26px solid rgba(255,255,255,.08)}
.top::before{content:"";position:absolute;right:30px;top:20px;width:120px;height:120px;border-radius:50%;border:16px solid rgba(212,162,58,.28)}
.top small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.top h1{margin:4px 0 8px;font:italic 700 30px/1.1 Georgia,"Times New Roman",serif;position:relative;z-index:1}
.hs{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-size:13px;position:relative;z-index:1}.hs:empty{display:none}
main{max-width:520px;margin:-38px auto 0;padding:0 14px 110px;position:relative}
.tab{display:none}.tab.on{display:block;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,details.goal{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.sub{font-size:13px;color:var(--mute);text-align:center}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--rose2),var(--rose));cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.96);opacity:.9}
button.o{background:none;color:var(--rose);border:1.5px solid var(--rose);width:100%;margin-top:10px}.row button.o{width:auto;margin:0;flex:1}
button.g{background:var(--line);color:var(--mute);padding:6px 11px;font-size:13px;border-radius:10px}
button.d{background:rgba(214,69,93,.14);color:var(--red)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--rose2);border-color:transparent}
input.big{font-size:22px;font-weight:700}
.row{display:flex;gap:8px}.row input{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips button{background:var(--bg);color:var(--rose);border:1px solid var(--line);padding:7px 13px;border-radius:99px;font-size:13px}
details.pick{margin-top:10px}summary{cursor:pointer;list-style:none;color:var(--mute);font-size:14px}summary::-webkit-details-marker{display:none}
.err{color:var(--red);font-size:13px;min-height:0;margin-top:6px}
.ringwrap{text-align:center;padding:20px 16px 18px}
.ring{position:relative;width:196px;height:196px;margin:0 auto}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{stroke:var(--line)}.ring .f{stroke:url(#gr);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pct{font:700 44px/1 Georgia,serif;color:var(--rose)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar.s{height:5px;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose2),var(--rose));border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px}.gn{font-weight:700}.gp{font-weight:700;color:var(--rose);display:flex;align-items:center;gap:6px}
.gm{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);gap:8px}
.tl{color:var(--ink);font-weight:700;font-size:15px}.now{color:var(--rose);font-weight:600}
.next b{font-size:18px}
.mini{display:grid;grid-template-columns:118px 1fr 38px;gap:10px;align-items:center;font-size:14px}.mini .bar{margin:0}.mini .pc{text-align:right;color:var(--mute);font-size:13px}.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.goal>summary{display:block}details.goal>summary::after{content:"";display:block;width:34px;height:4px;border-radius:9px;background:var(--line);margin:10px auto 0}
.items{border-top:1px solid var(--line);margin-top:10px}
.it{display:block;width:100%;text-align:left;background:none;color:var(--ink);border-radius:0;padding:12px 0;font-weight:400;border-bottom:1px solid var(--line)}.it .bar{display:block}.it.ok .gp{color:var(--green)}
.log{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.log small{display:block;color:var(--mute);font-size:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.duo>*{display:flex;flex-direction:column;gap:1px;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mute);text-align:left}.duo b{color:var(--ink);font-size:14px}
.duo .a{background:color-mix(in srgb,var(--mz) 12%,transparent);border-left:3px solid var(--mz)}.duo .b{background:color-mix(in srgb,var(--ch) 12%,transparent);border-left:3px solid var(--ch)}
.duo.s>*{padding:5px 8px;flex-direction:row;justify-content:space-between;align-items:center}.duo.s b{font-size:12px}
.duo.big>*{padding:12px}.duo .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;margin-bottom:6px}.duo .a .av{background:var(--mz)}.duo .b .av{background:var(--ch)}.duo.big b{font-size:17px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.col{min-width:0}
.col h3{margin:0 0 8px;font-size:13px;padding:7px 10px;border-radius:10px;display:flex;justify-content:space-between;gap:6px}
.col.a h3{background:color-mix(in srgb,var(--mz) 14%,transparent);color:var(--mz)}.col.b h3{background:color-mix(in srgb,var(--ch) 14%,transparent);color:var(--ch)}
.pi{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);padding:10px;border-radius:14px;margin-bottom:8px;font-weight:400;border-left:3px solid transparent}
.col.a .pi{border-left-color:var(--mz)}.col.b .pi{border-left-color:var(--ch)}
.pi .pn1{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}.pi b{display:block;font-size:15px;margin-top:2px}.pi small{display:block;color:var(--mute);font-size:11px;overflow-wrap:anywhere}.pi.ok b{color:var(--green)}.pi .bar{display:block}
.em{font-size:12px;color:var(--mute);text-align:center;padding:10px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{background:var(--bg);color:var(--mute);border:1.5px solid var(--line);padding:12px}
.seg button:first-child.on{background:color-mix(in srgb,var(--mz) 14%,transparent);color:var(--mz);border-color:var(--mz)}.seg button:nth-child(3).on{background:color-mix(in srgb,var(--gold) 22%,transparent);color:#a77a12;border-color:var(--gold)}.seg button:nth-child(2).on{background:color-mix(in srgb,var(--ch) 14%,transparent);color:var(--ch);border-color:var(--ch)}
.tg{font-size:11px;padding:2px 8px;border-radius:99px;margin-left:8px;font-weight:600;vertical-align:middle}.tg.a{background:color-mix(in srgb,var(--mz) 14%,transparent);color:var(--mz)}.tg.b{background:color-mix(in srgb,var(--ch) 14%,transparent);color:var(--ch)}
.pi{position:relative}.pi.sh{background:linear-gradient(135deg,color-mix(in srgb,var(--mz) 11%,var(--bg)),color-mix(in srgb,var(--ch) 13%,var(--bg)))}.pi.sh .pn1{padding-right:52px}.pi .pair{position:absolute;top:9px;right:8px}
.pair{display:inline-flex;align-items:center;vertical-align:middle}.pair i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10px system-ui;color:#fff;font-style:normal}
.pair i:first-child{background:var(--mz);animation:pl 2.4s ease-in-out infinite}.pair i:last-child{background:var(--ch);animation:pr 2.4s ease-in-out infinite}
.pair b{color:var(--ch);font-size:13px;margin:0 -3px;z-index:1;animation:hb 1.3s ease-in-out infinite}
@keyframes pl{50%{transform:translateX(5px)}}@keyframes pr{50%{transform:translateX(-5px)}}@keyframes hb{0%,100%{transform:scale(1)}30%{transform:scale(1.55)}60%{transform:scale(1.1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.lv{position:absolute;animation:fl 1.5s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-130px) scale(1.2) rotate(var(--r))}}
.lg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:3;display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px}
.lg button{background:none;color:#fff;padding:5px 12px;font-size:12px;border-radius:99px;letter-spacing:.06em}.lg button.on{background:#fff;color:var(--rose)}
#sp{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 30%,#c4486f,#5a2160 70%,#2a1236);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:32px;overflow:hidden;animation:spo .8s ease 4.2s forwards}
@keyframes spo{to{opacity:0;visibility:hidden}}
.spi{max-width:420px;position:relative}.sph{font-size:46px;color:#ffb3c9;animation:sph 1s ease both,hb 1.3s ease-in-out 1s infinite}@keyframes sph{from{opacity:0;transform:scale(.3)}}
#spt{font:700 29px/2 Amiri,"Noto Naskh Arabic","Droid Arabic Naskh","Traditional Arabic","Geeza Pro","Segoe UI",serif;margin:12px 0 18px;opacity:0;animation:spt 1.8s ease .6s forwards}
@keyframes spt{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.spn{font:italic 20px Georgia,serif;opacity:0;letter-spacing:.04em;color:#ffd9e4;animation:spt 1.4s ease 2s forwards}
.fh{position:absolute;bottom:-30px;left:var(--l);font-style:normal;color:rgba(255,255,255,.3);font-size:22px;animation:fy 6s linear var(--d) infinite}@keyframes fy{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
button,summary{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.24;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
nav button.on svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.6)}}
#fab{display:none;position:fixed;right:18px;bottom:calc(94px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;padding:0;z-index:6;place-items:center;box-shadow:0 10px 28px rgba(180,69,107,.5)}
body[data-tab=goals] #fab{display:grid;animation:fp .45s cubic-bezier(.3,1.6,.5,1)}body[data-tab=goals] main{padding-bottom:200px}
#fab svg{width:30px;height:30px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}@keyframes fp{from{transform:scale(.3);opacity:0}}
.big2{font:700 32px/1.1 Georgia,serif;margin:6px 0}.big2 small{font:400 14px system-ui;color:var(--mute)}
.due{font-size:14px;font-weight:600;margin:6px 0 10px}.due.warn{color:var(--amber)}.due.bad{color:var(--red)}.due.ok{color:var(--green)}
.sw{display:flex;gap:10px;margin:6px 0 14px}.swb{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid transparent}.swb.on{border-color:var(--ink)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed{display:grid;gap:2px}label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);margin-bottom:8px}
.chk{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ink)!important;font-size:15px!important}.chk input{width:auto}
.note{text-align:center;font-size:12px;color:var(--mute);margin:14px 0}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 8px 30px rgba(90,30,55,.22);display:flex;padding:6px;z-index:5}
nav button{flex:1;background:none;color:var(--mute);font-size:11px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:18px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
#sh{position:fixed;inset:0;background:#0008;backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}#sh[hidden]{display:none}
.pn{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.pn::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:var(--line);margin:-12px auto 14px}.pn h2{font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink)}.pn .row{align-items:center;margin-top:8px}.pn #ss{flex:1}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
#ts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2a1f24;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:90%;text-align:center}#ts.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#spt,.spn{opacity:1!important}}
</style>
</head>
<body>
<header class="top"><div class="lg" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="fr">FR</button></div><small>Wedding Planner</small><h1 id="ti">Mizou - Chouchou</h1><div class="hs" id="hs"></div></header>
<main>

<div class="tab on" id="t-home">
  <section class="card ringwrap" aria-label="Overall progress">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4a23a"/><stop offset="1" stop-color="#b4456b"/></linearGradient></defs><circle class="t" cx="60" cy="60" r="52" fill="none" stroke-width="11"/><circle class="f" id="rf" cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="mid"><div class="pct" id="pct">0%</div><div class="sub" id="tot"></div></div>
    </div>
    <div class="sub" id="left" style="margin-top:12px"></div>
  </section>
  <section class="card" id="hl" hidden></section>
  <section class="card next" id="next"></section>
  <section class="card" id="rl"></section>
  <section class="card">
    <h2>I saved money</h2>
    <div class="row"><input class="big" id="amt" type="number" inputmode="numeric" min="1" placeholder="Amount in DA" aria-label="Amount saved in DA"><button id="add">Add</button></div>
    <div class="chips"><button data-q="10000">+10,000</button><button data-q="30000">+30,000</button><button data-q="50000">+50,000</button><button data-q="100000">+100,000</button></div>
    <details class="pick"><summary>Choose where it goes (optional)</summary><div class="dc"><select id="dst" aria-label="Where to put the money"></select></div></details>
    <div class="err" id="err" role="alert"></div>
  </section>
  <section class="card"><h2>All goals</h2><div id="minis"></div></section>
</div>

<div class="tab" id="t-goals"><div id="goals"></div></div>

<div class="tab" id="t-loans"><div id="loans"></div><button class="o" data-act="al" style="width:100%">+ Add a loan</button></div>

<div class="tab" id="t-log"><section class="card"><h2>History</h2><div id="log"></div></section></div>

<div class="tab" id="t-share"></div>
<p class="note" id="st"></p>
</main>
<div id="sp" aria-hidden="true"><i class="fh" style="--l:8%;--d:0s">♥</i><i class="fh" style="--l:24%;--d:1.6s">♥</i><i class="fh" style="--l:42%;--d:.8s">♥</i><i class="fh" style="--l:60%;--d:2.4s">♥</i><i class="fh" style="--l:76%;--d:1.2s">♥</i><i class="fh" style="--l:90%;--d:3s">♥</i><div class="spi"><div class="sph">♥</div><p id="spt" lang="ar" dir="rtl"></p><div class="spn" id="spn"></div></div></div><div id="fx"></div><div id="sh" hidden></div><div id="ts" role="status"></div>
<button id="fab" data-act="ag" aria-label="Add big goal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav aria-label="Main">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Goals</button>
  <button data-tab="loans"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Loans</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-tab="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>PDF</button>
</nav>

<script>
let lang=(()=>{try{return localStorage.getItem("wl")==="fr"?"fr":"en"}catch(e){return"en"}})();
const uid=()=>Math.random().toString(36).slice(2,8);
const I=(n,t,p)=>({id:uid(),n,t,p:p||0});
const CFG=()=>({a:"Mizou",b:"Chouchou",date:"",theme:"rose",msg:"",si:true,sl:true,sh:true});
const DEFAULT=()=>({goals:[
 {id:uid(),n:"Wife's items",d:"by Dec 31, 2026",items:[I("Khatem",100000,30000),I("Sensla",170000,50000),I("Kftan",30000),I("Cosmetics",20000),I("Bag + sandals",10000)]},
 {id:uid(),n:"House preparation",d:"by Jul 1, 2027",items:[I("Chambre (bed + closet)",80000),I("Fridge",80000),I("Washing machine",50000),I("Stove",40000),I("Water heater",20000)]},
 {id:uid(),n:"Rent (1 year)",d:"by Jul 10, 2027",items:[I("Rent",180000)]},
 {id:uid(),n:"Wedding party",d:"Jul-Sep 2027",items:[I("Hall",70000),I("Food",130000)]},
 {id:uid(),n:"Honeymoon",d:"after the wedding",items:[I("Trip budget",300000)]}
],log:[],loans:[],cfg:CFG()});
const TH={rose:[[180,69,107],[250,228,235]],gold:[[176,133,40],[248,238,212]],emerald:[[14,124,74],[220,240,229]],navy:[[38,64,122],[225,231,245]],plum:[[110,52,120],[238,226,242]]};
let state=DEFAULT(),dst="auto",tab="home";
const $=id=>document.getElementById(id);
const C=2*Math.PI*52;
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,lang==="fr"?"\u00a0":",");
const num=v=>Math.max(0,Math.round(Number(v)||0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const fd=s=>pd(s).toLocaleDateString(lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short",year:"numeric"});
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return d};

/* reminders (Android app) */
async function sched(){
  const N=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!N)return;
  try{
    let p=await N.checkPermissions();
    if(p.display!=="granted"){if(!state.loans.length)return;p=await N.requestPermissions();if(p.display!=="granted")return}
    const pe=await N.getPending();if(pe.notifications.length)await N.cancel({notifications:pe.notifications});
    const list=[],now=new Date();let id=1;
    state.loans.forEach(l=>{let b=bal(l);for(let k=0;k<12&&b>0;k++){
      const d=due(l,nm(l)+k),a=Math.min(l.mo,b);b-=a;
      if(k===0&&d<sod()){const at=new Date();at.setDate(at.getDate()+1);at.setHours(9,0,0,0);list.push({id:id++,title:"Loan payment overdue",body:fmt(a)+" DA to "+l.who,schedule:{at,allowWhileIdle:true}})}
      [[2,"in 2 days"],[0,"today"]].forEach(([o,w])=>{const at=new Date(d);at.setDate(at.getDate()-o);at.setHours(9,0,0,0);
        if(at>now)list.push({id:id++,title:"Loan payment "+w,body:fmt(a)+" DA to "+l.who,schedule:{at,allowWhileIdle:true}})})}});
    if(list.length)await N.schedule({notifications:list});
  }catch(e){}
}
